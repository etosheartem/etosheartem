.hand{font:48px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;transform-box:fill-box;transform-origin:70% 80%;animation:wave 2.6s ease-in-out 1s infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
