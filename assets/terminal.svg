<g class="screen" xml:space="preserve"><g class="r0"><text x="26.0" y="68"><tspan fill="#9ece6a">artem</tspan><tspan fill="#565f89">@</tspan><tspan fill="#7aa2f7">homelab</tspan><tspan fill="#565f89">:</tspan><tspan fill="#7dcfff">~</tspan><tspan fill="#c0caf5">$ </tspan><tspan fill="#c0caf5">cat about.yaml</tspan></text><g class="c0"><rect x="194.8" y="51.5" width="158.9" height="25" fill="#1a1b26"/><rect class="k0" x="194.8" y="53.5" width="9.9" height="19.5" fill="#c0caf5"/></g></g><text class="r1" x="26.0" y="93"><tspan fill="#7aa2f7">name</tspan><tspan fill="#565f89">: </tspan><tspan fill="#9ece6a">Artem</tspan></text><text class="r2" x="26.0" y="118"><tspan fill="#7aa2f7">role</tspan><tspan fill="#565f89">: </tspan><tspan fill="#9ece6a">Cloud &amp; DevOps Engineer / Python Developer</tspan></text><text class="r3" x="26.0" y="143"><tspan fill="#7aa2f7">focus</tspan><tspan fill="#565f89">:</tspan></text><text class="r4" x="26.0" y="168"><tspan fill="#565f89">  - </tspan><tspan fill="#9ece6a">Cloud-Native Infrastructure &amp; Kubernetes</tspan></text><text class="r5" x="26.0" y="193"><tspan fill="#565f89">  - </tspan><tspan fill="#9ece6a">System Automation &amp; Internal Tooling</tspan></text><text class="r6" x="26.0" y="218"><tspan fill="#565f89">  - </tspan><tspan fill="#9ece6a">AI Agents &amp; LLM Integrations</tspan></text><text class="r7" x="26.0" y="243"><tspan fill="#7aa2f7">current_stack</tspan><tspan fill="#565f89">: [</tspan><tspan fill="#9ece6a">Kubernetes, Python, Docker, Linux, MikroTik</tspan><tspan fill="#565f89">]</tspan></text><text class="r8" x="26.0" y="268"><tspan fill="#7aa2f7">motto</tspan><tspan fill="#565f89">: </tspan><tspan fill="#e0af68">"Automate everything, keep it lean and rock-solid."</tspan></text><g class="r9"><text x="26.0" y="293"><tspan fill="#9ece6a">artem</tspan><tspan fill="#565f89">@</tspan><tspan fill="#7aa2f7">homelab</tspan><tspan fill="#565f89">:</tspan><tspan fill="#7dcfff">~</tspan><tspan fill="#c0caf5">$ </tspan><tsp